<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Vote Pilkades</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e6b4f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f2ea;--card:#fff;--ink:#16231d;--mut:#5d6b63;--pri:#1e6b4f;--acc:#e3b23c;--err:#c0392b;--line:#d9d5c6}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(160deg,#f4f2ea,#e4eee7);color:var(--ink);font:16px/1.4 "Plus Jakarta Sans",system-ui,"Segoe UI",Roboto,sans-serif}
.pg{height:100dvh;display:flex;flex-direction:column;gap:clamp(8px,1.8vh,18px);padding:max(clamp(10px,2vh,22px),env(safe-area-inset-top,0px)) clamp(14px,3vw,36px) max(clamp(10px,2vh,22px),env(safe-area-inset-bottom,0px))}
.hd{position:relative;text-align:center;background:var(--pri);color:#fff;border-radius:18px;padding:12px clamp(90px,16vw,170px);font-weight:800;line-height:1.25;font-size:clamp(.95rem,2.6vmin,1.5rem);letter-spacing:.04em}
.hd span{display:block;font-weight:600;opacity:.9}
.hd em{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-style:normal;background:var(--acc);color:#16231d;padding:6px 14px;border-radius:99px;font-size:.8em;letter-spacing:0}
.ins{margin:0;text-align:center;font-size:clamp(1rem,2.5vmin,1.4rem);font-weight:600}.ins b{color:var(--pri)}
.cands{flex:1;min-height:0;display:flex;gap:clamp(8px,1.6vw,20px)}
.kart{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;border:4px solid var(--line);border-radius:20px;background:var(--card);overflow:hidden;padding:0;font:inherit;color:inherit;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.1);transition:transform .15s,border-color .15s}
.kart.on{transform:translateY(-6px);border-color:var(--pri);box-shadow:0 0 0 5px var(--acc),0 14px 28px rgba(0,0,0,.2)}
.foto{flex:1;min-height:0;display:grid;place-items:center}.foto span{font-size:clamp(3rem,13vmin,7rem);line-height:1}
.nm{padding:10px 4px;font-weight:800;font-size:clamp(1rem,2.8vmin,1.6rem);text-align:center;border-top:3px solid var(--line);color:var(--pri)}
.no{position:absolute;top:10px;left:10px;width:clamp(38px,7vmin,56px);height:clamp(38px,7vmin,56px);border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:clamp(1.2rem,3.6vmin,1.9rem);border:3px solid #fff}
.ck{display:none;position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;background:var(--acc);color:#16231d;font-style:normal;font-weight:800;font-size:1.5rem;place-items:center}.kart.on .ck{display:grid}
.btn{display:block;width:100%;min-height:clamp(52px,9vmin,72px);border:0;border-radius:14px;background:var(--pri);color:#fff;font:800 clamp(1rem,2.6vmin,1.4rem) inherit;font-family:inherit;cursor:pointer}
.btn.red{background:var(--err)}.row{display:flex;gap:16px}.row .btn{flex:1}
.ch{text-align:center}.ch h1{margin:0;font-size:clamp(1.4rem,4vmin,2.2rem)}.q{margin:4px 0 0;color:var(--err);font-weight:700;font-size:clamp(1rem,2.6vmin,1.4rem)}
.one{flex:1;min-height:0;display:flex;justify-content:center}.one .kart{aspect-ratio:3/4;height:100%;flex:none;cursor:default}
.scan{position:fixed;inset:0;background:#000;overflow:hidden}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame{position:absolute;top:54%;left:50%;width:min(52vh,52vw);aspect-ratio:1;transform:translate(-50%,-50%);border:4px solid var(--acc);border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.hint{position:absolute;top:14px;left:0;right:0;text-align:center;color:#fff;display:flex;flex-direction:column;text-shadow:0 1px 4px #000;padding:0 16px}.hint b{font-size:clamp(1.1rem,3vmin,1.7rem)}
.err{position:absolute;bottom:14px;left:14px;right:14px;text-align:center;background:rgba(0,0,0,.7);color:#ffd2c9;padding:8px;border-radius:10px;font-weight:700}.err:empty{display:none}
.done{height:100dvh;display:grid;place-content:center;text-align:center;background:var(--pri);color:#fff;padding:20px}
.done i{font-style:normal;width:clamp(80px,18vmin,140px);height:clamp(80px,18vmin,140px);border-radius:50%;background:#fff;color:var(--pri);display:grid;place-items:center;font-size:clamp(3rem,10vmin,5.5rem);font-weight:800;margin:0 auto 18px}
.done h1{margin:0 0 6px;font-size:clamp(1.6rem,5vmin,3rem)}.done p{margin:0;opacity:.9;font-size:clamp(1rem,2.6vmin,1.4rem)}
.pbtn{position:absolute;right:14px;bottom:64px;z-index:5;border:0;border-radius:99px;padding:10px 16px;font:700 .9rem inherit;font-family:inherit;background:rgba(255,255,255,.92);color:#16231d;cursor:pointer}.pbtn.ok{background:var(--acc)}
#print{display:none;font-family:monospace;text-align:center;color:#000}
@page{size:58mm auto;margin:2mm}
@media print{body>*:not(#print){display:none!important}#print{display:block!important}html,body{overflow:visible;height:auto}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="config.js"></script>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<script>
var st=load(),scr='scan',sess=null,sel=null,rc=null,vt=null,err='',stream=null,timer=null,cv=null,lastC='',lastT=0;
function judul(){return 'SIMULASI PEMILIHAN KEPALA DESA'}
function hd(){return '<div class="hd">'+judul()+'<span>DESA '+st.desa.toUpperCase()+'</span><span>'+CONFIG.kec+'</span><em>TPS '+st.tps+' / BILIK '+st.bilik+'</em></div>'}
function kart(c,i,on,act){return '<button class="kart'+(on?' on':'')+'" '+(act?'onclick="pick('+i+')"':'')+'><div class="foto" style="background:'+c.bg+'"><span>'+c.e+'</span></div><span class="no">'+(i+1)+'</span><i class="ck">&#10003;</i><div class="nm">'+c.n+'</div></button>'}
function render(){
 var a=document.getElementById('app');
 if(scr=='scan'){a.innerHTML='<div class="scan"><video id="cam" playsinline muted autoplay></video><div class="frame" onclick="startCam()"></div><div class="hint"><b>'+judul()+' DESA '+st.desa.toUpperCase()+'</b><span>TPS '+st.tps+' / Bilik '+st.bilik+'</span><span>Tunjukkan QR undangan ke kotak. Sentuh kotak jika kamera belum menyala.</span></div><button id="pbtn" class="pbtn'+(prn?' ok':'')+'" onclick="sambungPrinter()">'+pLabel()+'</button><div class="err" role="alert">'+err+'</div></div>';
  var ok=0;try{ok=localStorage.getItem('camok')}catch(e){}if(ok)setTimeout(startCam,150);return}
 if(scr=='vote'){a.innerHTML='<div class="pg">'+hd()+'<p class="ins">Selamat datang <b>'+vt.n+'</b>, silakan pilih calon kepala desa pilihan Anda.</p><div class="cands">'+CONFIG.cands.map(function(c,i){return kart(c,i,sel===i,1)}).join('')+'</div><button class="btn" style="visibility:'+(sel===null?'hidden':'visible')+'" onclick="scr=\'confirm\';render()">Pilih Kandidat Ini</button></div>';return}
 if(scr=='confirm'){a.innerHTML='<div class="pg"><div class="ch"><h1>Konfirmasi Pemilihan</h1><p class="q">Apa Anda yakin akan memilih kandidat ini?</p></div><div class="one">'+kart(CONFIG.cands[sel],sel,true,0)+'</div><div class="row"><button class="btn red" onclick="sel=null;scr=\'vote\';render()">Ulangi</button><button class="btn" onclick="kirim()">Pilih</button></div></div>';return}
 a.innerHTML='<div class="done"><div><i>&#10003;</i><h1>Pilihan Anda telah direkam</h1><p>Terima kasih. Struk pilihan sedang dicetak.</p></div></div>';
}
function setErr(m){err=m;var e=document.querySelector('.err');if(e)e.textContent=m;setTimeout(function(){if(err==m){err='';var x=document.querySelector('.err');if(x)x.textContent=''}},4000)}
function stopCam(){clearInterval(timer);if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}}
async function startCam(){
 stopCam();var v=document.getElementById('cam');if(!v)return;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return setErr('Kamera tidak tersedia. Buka lewat alamat HTTPS.');
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;await v.play();try{localStorage.setItem('camok','1')}catch(e){}
  var det=null;try{if('BarcodeDetector' in window)det=new BarcodeDetector({formats:['qr_code']})}catch(e){}
  timer=setInterval(async function(){try{
   if(det){var r=await det.detect(v);if(r.length)cek(r[0].rawValue)}
   else if(window.jsQR&&v.videoWidth){var k=Math.min(1,640/v.videoWidth),w=Math.round(v.videoWidth*k),h=Math.round(v.videoHeight*k);cv=cv||document.createElement('canvas');cv.width=w;cv.height=h;var x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);var d=x.getImageData(0,0,w,h),q=jsQR(d.data,w,h);if(q&&q.data)cek(q.data)}
  }catch(e){}},350);
 }catch(e){setErr('Kamera tidak bisa dibuka ('+(e&&e.name)+'). Izinkan akses kamera, lalu sentuh kotak pemindai.')}
}
function cek(c){
 if(scr!='scan')return;c=(c||'').trim().toUpperCase();var n=Date.now();if(c==lastC&&n-lastT<2500)return;lastC=c;lastT=n;st=load();
 if(!st.open)return setErr('Pemungutan suara belum dibuka atau sudah ditutup.');
 var v=voter(c);if(!v)return setErr('Kode QR tidak dikenali.');
 if(String(v.b)!=String(st.bilik))return setErr('Undangan ini untuk Bilik '+v.b+'. Silakan menuju Bilik '+v.b+'.');
 if(st.used[c])return setErr('Undangan ini sudah dipakai.');
 stopCam();sess=c;vt=v;sel=null;scr='vote';err='';render();
}
function pick(i){sel=i;render()}
function kirim(){
 st=load();if(!st.open||st.used[sess]){selesai();return}
 st.used[sess]=1;var id='R-'+Math.random().toString(36).slice(2,8).toUpperCase(),t=new Date().toLocaleString('id-ID');
 st.votes.push({id:id,no:sel+1,t:t,tps:st.tps,bilik:st.bilik});save(st);
 rc={id:id,t:t,no:sel+1,n:CONFIG.cands[sel].n};scr='done';render();
 setTimeout(cetak,200);setTimeout(selesai,3000);
}
var prn=null,prnName='';
function pLabel(){return prn?'Printer: '+prnName:'Sambung Printer'}
function pStatus(){var b=document.getElementById('pbtn');if(b){b.textContent=pLabel();b.className='pbtn'+(prn?' ok':'')}}
function pakaiUsb(d,ep){prn=function(b){return d.transferOut(ep,b)};prnName=d.productName||'USB';pStatus()}
async function bukaUsb(d){
 await d.open();if(!d.configuration)await d.selectConfiguration(1);
 var ifc=d.configuration.interfaces.find(function(i){return i.alternates[0].endpoints.some(function(e){return e.direction=='out'})});
 await d.claimInterface(ifc.interfaceNumber);
 pakaiUsb(d,ifc.alternates[0].endpoints.find(function(e){return e.direction=='out'}).endpointNumber);
}
async function sambungPrinter(){
 try{
  if(navigator.usb){
   var d=await navigator.usb.requestDevice({filters:[]});await bukaUsb(d);return;
  }
 }catch(e){}
 try{
  if(navigator.bluetooth){
   var S='000018f0-0000-1000-8000-00805f9b34fb';
   var dv=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[S]});
   var sv=await(await dv.gatt.connect()).getPrimaryService(S);
   var ch=(await sv.getCharacteristics()).find(function(c){return c.properties.write||c.properties.writeWithoutResponse});
   prn=async function(b){
    if(!dv.gatt.connected){sv=await(await dv.gatt.connect()).getPrimaryService(S);ch=(await sv.getCharacteristics()).find(function(c){return c.properties.write||c.properties.writeWithoutResponse})}
    for(var i=0;i<b.length;i+=100){var k=b.slice(i,i+100);if(ch.properties.writeWithoutResponse)await ch.writeValueWithoutResponse(k);else await ch.writeValue(k)}
   };
   prnName=dv.name||'Bluetooth';pStatus();return;
  }
 }catch(e){}
 prn=null;setErr('Printer tidak tersambung. Gunakan Chrome/Edge (HTTPS) dan pilih printer.');
}
async function autoUsb(){
 try{if(!navigator.usb)return;var l=await navigator.usb.getDevices();if(l.length)await bukaUsb(l[0])}catch(e){prn=null}
}
function escpos(r){
 var enc=new TextEncoder(),o=[0x1B,0x40];
 function tx(t){var b=enc.encode(t);for(var i=0;i<b.length;i++)o.push(b[i])}
 function al(n){o.push(0x1B,0x61,n)}
 function bd(n){o.push(0x1B,0x45,n)}
 function sz(n){o.push(0x1D,0x21,n)}
 var gr='--------------------------------\n';
 al(1);bd(1);tx('SIMULASI PEMILIHAN\nKEPALA DESA\n');bd(0);
 tx('DESA '+st.desa.toUpperCase()+'\n');
 bd(1);tx('TPS '+st.tps+' / BILIK '+st.bilik+'\n');bd(0);
 tx(r.t+'\nResi: '+r.id+'\n'+gr+'PILIHAN\n');
 sz(0x11);bd(1);tx('No. '+r.no+'\n');sz(0);tx(r.n+'\n');bd(0);
 tx(gr+'Bukti suara tercatat\n\n\n\n');
 o.push(0x1D,0x56,0x42,0x00);
 return new Uint8Array(o);
}
async function cetak(){
 if(prn){try{await prn(escpos(rc));return}catch(e){prn=null;pStatus()}}
 var p=document.getElementById('print');
 p.innerHTML='<h3>SIMULASI PEMILIHAN KEPALA DESA</h3><p>DESA '+st.desa.toUpperCase()+'</p><p><b>TPS '+st.tps+' / BILIK '+st.bilik+'</b></p><p>'+rc.t+'</p><p>Resi: '+rc.id+'</p><p>--------------------</p><p>PILIHAN</p><h2>No. '+rc.no+'</h2><h3>'+rc.n+'</h3><p>--------------------</p><p>Bukti suara tercatat</p>';
 window.print();
}
function selesai(){if(scr!='done'&&scr!='vote'&&scr!='confirm')return;sess=null;vt=null;sel=null;rc=null;scr='scan';err='';render()}
function fs(){if((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone)return;var d=document.documentElement;if(document.fullscreenElement||!d.requestFullscreen)return;try{d.requestFullscreen().then(function(){try{var q=screen.orientation.lock('landscape');q&&q.catch&&q.catch(function(){})}catch(e){}}).catch(function(){})}catch(e){}}
document.addEventListener('pointerdown',fs);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
render();autoUsb();
</script>
</body>
</html>
