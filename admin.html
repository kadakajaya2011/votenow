<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panitia</title>
<style>
:root{--bg:#f4f2ea;--card:#fff;--ink:#16231d;--mut:#5d6b63;--pri:#1e6b4f;--acc:#e3b23c;--err:#c0392b;--line:#d9d5c6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.3rem 0}h2{font-size:1.1rem;margin:1.2rem 0 .4rem}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:8px}
input,select{width:100%;min-height:46px;border:2px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;background:#fff;color:var(--ink)}
label{display:block;font-weight:600;margin-top:8px}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:12px;background:var(--pri);color:#fff;font:700 1rem inherit;font-family:inherit;margin-top:10px;cursor:pointer;text-align:center;text-decoration:none;padding:12px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.row{display:flex;gap:10px}.row>*{flex:1}
.mut{color:var(--mut);font-size:.9rem}.err{color:var(--err);font-weight:700;min-height:1.4em}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:700;font-size:.85rem;background:var(--acc)}
.bar{height:22px;border-radius:6px;background:var(--line);overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--pri)}
.ls div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.95rem}
</style>
<script src="config.js"></script>
</head>
<body>
<main id="app"></main>
<script>
var st=load(),ok=false,err='';
function R(){st=load();var a=document.getElementById('app');
 if(!ok){a.innerHTML='<div class="box" style="margin-top:18vh"><input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off"><button class="btn" onclick="masuk()">Masuk</button><div class="err" role="alert">'+err+'</div></div>';return}
 var vs=CONFIG.dpt.filter(function(v){return String(v.b)==String(st.bilik)}),used=vs.filter(function(v){return st.used[v.k]}).length,tot=st.votes.length;
 var h='<h1>Panel panitia</h1><div class="box"><p>Status: <span class="tag">'+(st.open?'Pemungutan dibuka':'Pemungutan ditutup')+'</span></p><p class="mut">Bilik '+st.bilik+': '+used+' dari '+vs.length+' pemilih sudah memilih</p><button class="btn" onclick="tog()">'+(st.open?'Tutup pemungutan suara':'Buka pemungutan suara')+'</button></div>';
 h+='<h2>Pengaturan perangkat ini</h2><div class="box"><label>Nama desa</label><input value="'+st.desa.replace(/"/g,'&quot;')+'" onchange="set(\'desa\',this.value)"><div class="row"><div><label>TPS</label><input value="'+st.tps+'" onchange="set(\'tps\',this.value)"></div><div><label>Nomor bilik</label><select onchange="set(\'bilik\',this.value)"><option value="1"'+(st.bilik=='1'?' selected':'')+'>Bilik 1</option><option value="2"'+(st.bilik=='2'?' selected':'')+'>Bilik 2</option></select></div></div></div>';
 h+='<h2>Hasil rekapitulasi</h2><div class="box">';
 if(st.open)h+='<p class="mut">Hasil tampil setelah pemungutan ditutup.</p>';
 else if(!tot)h+='<p class="mut">Belum ada suara masuk.</p>';
 else{var cnt=CONFIG.cands.map(function(c,i){return st.votes.filter(function(v){return v.no==i+1}).length}),mx=Math.max.apply(null,cnt);
  h+=CONFIG.cands.map(function(c,i){var p=Math.round(cnt[i]/tot*1000)/10;return '<b>'+(i+1)+'. '+c.n+'</b> <span class="mut">'+cnt[i]+' suara ('+p+'%)</span>'+(cnt[i]==mx?' <span class="tag">unggul</span>':'')+'<div class="bar"><i style="width:'+p+'%"></i></div>'}).join('')+'<p class="mut">Total suara sah di perangkat ini: '+tot+'</p>'}
 h+='</div><h2>Daftar pemilih Bilik '+st.bilik+'</h2><div class="box ls">'+vs.map(function(v){return '<div><span>'+v.no+'. '+v.n+'</span><span class="mut">'+(st.used[v.k]?'sudah memilih':'belum')+'</span></div>'}).join('')+'</div>';
 h+='<button class="btn alt" onclick="rst()">Reset suara di perangkat ini</button><a class="btn alt" href="index.html">Kembali ke bilik suara</a><button class="btn alt" onclick="ok=false;R()">Keluar</button>';
 a.innerHTML=h}
function masuk(){if(document.getElementById('pin').value===CONFIG.pin){ok=true;err=''}else err='PIN salah.';R()}
function tog(){st=load();st.open=!st.open;save(st);R()}
function set(k,v){st=load();st[k]=(v+'').trim()||st[k];save(st);R()}
function rst(){if(confirm('Hapus semua suara dan status pemilih di perangkat ini?')){st=load();st.used={};st.votes=[];save(st);R()}}
setInterval(function(){if(ok&&!document.activeElement.matches('input,select'))R()},4000);
R();
</script>
</body>
</html>
